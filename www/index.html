      async function startScan() {
        var v=document.getElementById("scanVideo");
        if(!v)return;
        if(!("BarcodeDetector" in window)) {
          alert("المتصفح لا يدعم مسح QR. أدخل رقم الأيدي يدوياً.");
          return
        }
        if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia) {
          alert("الكاميرا تحتاج إلى اتصال آمن HTTPS.");
          return
        }
        try{
          var fm=await BarcodeDetector.getSupportedFormats(),formats=fm.indexOf("qr_code")>=0?["qr_code"]:fm;
          scanDetector=new BarcodeDetector({
            formats:formats
          });
          scanStream=await navigator.mediaDevices.getUserMedia({
            video:{
              facingMode:{
                ideal:"environment"
              }
            },audio:false
          });
          v.srcObject=scanStream;
          v.style.display="block";
          await v.play();
          var loop=async function() {
            if(!scanStream||!scanDetector)return;
            try{
              var codes=await scanDetector.detect(v);
              if(codes&&codes.length) {
                var raw=codes[0].rawValue,found=findPerson(raw);
                if(found) {
                  openScannedPerson(found);
                  return
                }
                var input=document.getElementById("scanInput");
                if(input)input.value=raw;
                showScanResult(null,raw);
                stopScan();
                return
              }
            } catch(e){}
            scanTimer=setTimeout(loop,250)
          };

  var _sU=sUsers;
  sUsers=function(){
    var tp=S.users.reduce(function(a,u){return a+u.persons},0);
    return '<div class="stats"><div class="st"><i>👥</i><div><span>المستفيدون</span><b>'+S.users.length+'</b></div></div><div class="st"><i>👨‍👩‍👧</i><div><span>إجمالي الأفراد</span><b>'+tp+'</b></div></div><div class="st"><i>💰</i><div><span>المبلغ الكلي</span><b style="font-size:1.05rem">'+num(tp*S.price)+'</b><small>دينار عراقي</small></div></div></div>'+_sU()
  };

  /* ============ 3) الأخبار داخل التطبيق (بدون روابط) ============ */
  var NEWS={items:[],at:0,st:'idle',last:0},newsBusy=false;
  try{var nc=JSON.parse(localStorage.getItem('mb2news')||'null');if(nc&&nc.items){NEWS.items=nc.items;NEWS.at=nc.at||0}}catch(e){}
  var NQ=['وزارة التجارة العراقية','البطاقة التموينية العراق','الأمن الغذائي العراق'];
  function feed(q){return 'https://news.google.com/rss/search?q='+encodeURIComponent(q+' when:14d')+'&hl=ar&gl=IQ&ceid=IQ:ar'}
  function splitT(t){t=String(t||'').replace(/\s+/g,' ').trim();var i=t.lastIndexOf(' - ');return i>8?{t:t.slice(0,i),s:t.slice(i+3)}:{t:t,s:''}}
  function viaJson(q){
    return fetch('https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent(feed(q))).then(function(r){return r.json()}).then(function(j){
      if(!j||j.status!=='ok'||!j.items||!j.items.length)throw new Error('bad');
      return j.items.map(function(i){var p=splitT(i.title),d=Date.parse(String(i.pubDate||'').replace(' ','T')+'Z');return{t:p.t,s:p.s||i.author||'',d:isNaN(d)?0:d}})
    })
  }
  function viaXml(url){
    return fetch(url).then(function(r){return r.text()}).then(function(x){
      var doc=new DOMParser().parseFromString(x,'text/xml'),its=doc.querySelectorAll('item');
      if(!its.length)throw new Error('empty');
      return Array.prototype.map.call(its,function(it){
        var g1=function(n){var e=it.querySelector(n);return e?e.textContent:''},p=splitT(g1('title')),d=Date.parse(g1('pubDate'));
        return{t:p.t,s:g1('source')||p.s,d:isNaN(d)?0:d}
      })
    })
  }
  function getFeed(q){
    var f=feed(q);
    return viaJson(q).catch(function(){return viaXml('https://api.allorigins.win/raw?url='+encodeURIComponent(f))}).catch(function(){return viaXml('https://corsproxy.io/?url='+encodeURIComponent(f))})
  }
  function ago(t){
    var s=(Date.now()-t)/1000;
    if(s<90)return 'الآن';
    if(s<3600)return 'قبل '+Math.round(s/60)+' دقيقة';
    if(s<86400)return 'قبل '+Math.round(s/3600)+' ساعة';
    return 'قبل '+Math.round(s/86400)+' يوم'
  }
  function newsList(){
    var h='';
    if(NEWS.st==='load')h+='<div class="card" style="text-align:center;margin-bottom:10px"><div class="spin"></div><p class="mu">جارٍ جلب آخر الأخبار...</p></div>';
    if(NEWS.st==='err')h+='<div class="card" style="margin-bottom:10px"><b>⚠️ تعذّر جلب الأخبار الآن</b><p class="mu">تأكد من الإنترنت ثم اضغط «تحديث».</p></div>';
    if(NEWS.st==='stale')h+='<p class="mu">تعذّر التحديث الآن، هذه آخر أخبار محفوظة.</p>';
    h+=NEWS.items.map(function(x){
      return '<div class="nwc"><div class="nwt">'+esc(x.t)+'</div><div class="nwm">'+(x.s?'<span class="badge">'+esc(x.s)+'</span>':'')+(x.d?'<span class="mu">'+ago(x.d)+' · '+dt(x.d)+'</span>':'')+'</div></div>'
    }).join('');
    return h
  }
  function paintNews(){var b=document.getElementById('newsBox');if(b)b.innerHTML=newsList()}
  function loadNews(force){
    if(typeof fetch!=='function'||newsBusy)return;
    if(!force){
      if(NEWS.items.length&&Date.now()-NEWS.at<20*60*1000)return;
      if(Date.now()-NEWS.last<60000)return;
    }
    newsBusy=true;NEWS.last=Date.now();NEWS.st='load';paintNews();
    Promise.all(NQ.map(function(q){return getFeed(q).catch(function(){return null})})).then(function(rs){
      var ok=rs.filter(Boolean);
      if(!ok.length){NEWS.st=NEWS.items.length?'stale':'err';return}
      var seen={},all=[];
      ok.forEach(function(a){a.forEach(function(x){var k=nm(x.t).slice(0,60);if(!k||seen[k])return;seen[k]=1;all.push(x)})});
      all.sort(function(a,b){return b.d-a.d});
      NEWS.items=all.slice(0,25);NEWS.at=Date.now();NEWS.st='ok';
      try{localStorage.setItem('mb2news',JSON.stringify({items:NEWS.items,at:NEWS.at}))}catch(e){}
    }).catch(function(){NEWS.st=NEWS.items.length?'stale':'err'}).then(function(){newsBusy=false;paintNews()})
  }
  newsView=function(){
    return '<div class="xhero"><h3>📰 أخبار وزارة التجارة والمواد الغذائية</h3><p class="mu">آخر الأخبار تظهر هنا مباشرة وتتحدّث تلقائياً.</p><button data-a="newsReload">🔄 تحديث الأخبار</button></div><div id="newsBox">'+newsList()+'</div>'
  };

  /* ============ 4) إعدادات المستفيد + مراسلة الوكيل ============ */
  function uFrame(u,body,p){
    return '<div class="wrap"><div class="top"><div class="tl">'+leaf(40)+'<div><h1>وكيل الغذاء</h1><small>'+esc(u.name)+' · الخدمات</small></div></div><div class="act">'+thBtn()+(p==='menu'?'<button data-a="backUser">رجوع</button>':'<button data-a="mePage" data-page="menu">رجوع</button>')+'<button data-a="out">خروج 🚪</button></div></div>'+body+'</div>'
  }
  function menuBody(){
    return '<div class="xgrid">'+[['market','🛍️','سوق المواد والاستفسار'],['news','📰','أخبار التجارة والمواد الغذائية'],['ration','🪪','تطبيق البطاقة التموينية'],['set','⚙️','إعدادات حسابي'],['msg','✉️','مراسلة الوكيل']].map(function(x){
      return '<button class="card svc" data-a="mePage" data-page="'+x[0]+'"><span>'+x[1]+'</span><b>'+x[2]+'</b></button>'
    }).join('')+'</div>'
  }
  function setBody(u){
    return '<div class="card" style="max-width:640px"><h3>⚙️ إعدادات حسابي</h3><div class="it"><span>🪪 رقم الأيدي</span><b>#'+u.id+'</b></div><label>الاسم (يُستخدم عند تسجيل الدخول)</label><input id="myName" value="'+esc(u.name)+'"><p class="mu">إذا غيّرت اسمك سجّل الدخول بعدها بالاسم الجديد مع نفس الكود.</p><button class="p" data-a="saveName" style="width:100%">💾 حفظ الاسم</button></div>'
  }
  function msgBody(u){
    var mine=S.msgs.filter(function(m){return m.uid==u.id}).sort(function(a,b){return(b.at||0)-(a.at||0)});
    return '<div class="card"><h3>✉️ مراسلة الوكيل</h3><textarea id="msgText" rows="4" maxlength="600" placeholder="اكتب رسالتك للوكيل...">'+esc(msgDraft)+'</textarea><button class="p" data-a="sendMsg" style="width:100%;margin-top:10px">📨 إرسال الرسالة</button></div>'+
      '<div class="card" style="margin-top:12px"><h3>📜 رسائلي</h3>'+(mine.map(function(m){
        return '<div class="mb"><div>'+esc(m.text).replace(/\n/g,'<br>')+'</div><small class="mu">'+dt(m.at)+(m.read?' · ✔ اطّلع عليها الوكيل':' · ⏳ لم تُقرأ بعد')+'</small>'+(m.reply?'<div class="rep">↩️ رد الوكيل: '+esc(m.reply)+'</div>':'')+'</div>'
      }).join('')||'<p class="mu">لا توجد رسائل بعد.</p>')+'</div>'
  }
  var _vU3=vUser;
  vUser=function(){
    if(!me||me.r!=='u')return _vU3();
    var u=byId(me.id),p=userExtraPage;
    if(!u||!(p==='menu'||p==='news'||p==='set'||p==='msg'))return _vU3();
    return uFrame(u,p==='menu'?menuBody():p==='news'?newsView():p==='set'?setBody(u):msgBody(u),p)
  };

  /* صفحة الرسائل عند الأدمن */
  function msgsAdmin(){
    var L=S.msgs.slice().sort(function(a,b){return(b.at||0)-(a.at||0)}),un=MC();
    return '<div class="xhero"><h3>✉️ رسائل المستفيدين</h3><p class="mu">'+(un?un+' رسالة غير مقروءة':'لا توجد رسائل جديدة')+'</p>'+(un?'<button data-a="msgAllRead">✔ تحديد الكل كمقروء</button>':'')+'</div>'+
      (L.map(function(m){
        var u=byId(m.uid);
        return '<div class="card msg'+(m.read?'':' un')+'" style="margin-bottom:10px"><div class="ch"><b>'+esc(u?u.name:m.name)+(u?' <span class="id">#'+u.id+'</span>':'')+'</b><span class="mu">'+dt(m.at)+'</span></div><p class="mt">'+esc(m.text).replace(/\n/g,'<br>')+'</p>'+(m.reply?'<div class="rep">↩️ ردّك: '+esc(m.reply)+'</div>':'')+
          '<div class="chips" style="margin-top:8px"><button class="p" data-a="msgReply" data-id="'+esc(m.id)+'">💬 رد</button><button data-a="msgRead" data-id="'+esc(m.id)+'">'+(m.read?'إلغاء المقروء':'✔ مقروءة')+'</button>'+(u?waBtn(u,u.phone,'واتساب'):'')+'<button class="d" data-a="msgDel" data-id="'+esc(m.id)+'">حذف</button></div></div>'
      }).join('')||'<div class="card"><p class="mu">لا توجد رسائل بعد.</p></div>')
  }
  var _vA3=vAdmin;
  vAdmin=function(){return tab==='m'?xFrame('الرسائل',msgsAdmin()):_vA3()};
  if(!NAV.some(function(n){return n[0]==='m'})){var qi=NAV.map(function(n){return n[0]}).indexOf('q');NAV.splice(qi+1,0,['m','✉️','الرسائل'])}
  TT.m='الرسائل';

  function paintBadges(){
    if(!(me&&me.r==='a'))return;
    var n=MC();
    if(n)document.querySelectorAll('.side .nv[data-t=m]').forEach(function(b){if(!b.querySelector('.cnt'))b.insertAdjacentHTML('beforeend','<em class="cnt">'+n+'</em>')})
  }
  var _r3=render;
  render=function(){_r3();paintBadges();if(document.getElementById('newsBox'))loadNews(false)};
  var _ar3=applyRemote;
  applyRemote=function(rd){var b=MC();_ar3(rd);if(me&&me.r==='a'&&MC()>b)toast('✉️ وصلتك رسالة جديدة من مستفيد')};

  document.addEventListener('input',function(e){if(e.target&&e.target.id==='msgText')msgDraft=e.target.value});

  document.addEventListener('click',function(ev){
    var b=ev.target.closest('[data-a]');if(!b)return;
    var a=b.dataset.a,id=b.dataset.id,isU=me&&me.r==='u',isA=me&&me.r==='a';
    if(a==='newsReload'){loadNews(true);return}
    if(a==='saveName'&&isU){
      var u=byId(me.id);if(!u)return;
      var n=g('myName').trim().replace(/\s+/g,' ');
      if(n.length<3){alert('اكتب اسمك الكامل');return}
      if(n.length>60){alert('الاسم طويل جداً');return}
      var nn=nm(n).replace(/\s+/g,' ');
      if(S.users.some(function(x){return x.id!=u.id&&nm(x.name).replace(/\s+/g,' ')===nn})){alert('هذا الاسم مستخدم من شخص آخر، اكتب اسماً مختلفاً');return}
      if(n===u.name){toast('الاسم نفسه، ما تغيّر شي');return}
      u.name=n;sv();toast('✅ تم حفظ الاسم');render();return
    }
    if(a==='sendMsg'&&isU){
      var u2=byId(me.id);if(!u2)return;
      var t=(g('msgText')||'').trim();
      if(!t){alert('اكتب رسالتك أولاً');return}
      if(t.length>600){alert('الرسالة طويلة، الحد الأقصى 600 حرف');return}
      S.msgs.unshift({id:'m'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),uid:u2.id,name:u2.name,text:t,at:Date.now(),read:false,reply:'',rat:0});
      S.msgs=S.msgs.slice(0,300);msgDraft='';sv();toast('✅ وصلت رسالتك للوكيل');render();return
    }
    if(!isA)return;
    var m=(S.msgs||[]).filter(function(x){return x.id==id})[0];
    if(a==='msgAllRead'){S.msgs.forEach(function(x){x.read=true});sv();render()}
    else if(a==='msgRead'&&m){m.read=!m.read;sv();render()}
    else if(a==='msgReply'&&m){
      var r=prompt('اكتب ردّك للمستفيد:',m.reply||'');
      if(r===null)return;
      m.reply=r.trim().slice(0,600);m.rat=Date.now();m.read=true;sv();render()
    }
    else if(a==='msgDel'&&m){if(confirm('حذف هذه الرسالة؟')){S.msgs=S.msgs.filter(function(x){return x.id!=id});sv();render()}}
  });

  render();
})();
    </script>
  
    <script>
/* Supabase session and login controller */
(function(){
  var busy=false;
  function fill(u,p){var a=document.getElementById('lu'),b=document.getElementById('lp');if(a)a.value=u;if(b)b.value=p;}
  function hasData(d){return !!(d&&((d.users&&d.users.length)||(d.items&&d.items.length)||(d.deleg&&d.deleg.length)||(d.msgs&&d.msgs.length)));}
  function fbInit(){
    if(!window.FB)return;
    if(!localStorage.getItem('foodAgentSession')){FBr=false;cloud='wait';cloudErr='';if(me){me=null;ses();}render();return;}
    FBr=false;cloud='wait';
    window.FB.sub(function(remote,pending){
      if(pending)return;
      var first=!FBr;FBr=true;cloud='ok';cloudErr='';var rd=fix(remote||{});
      if(first){S=base?mAll(base,S,rd):rd;base=CL(rd);saveBase();try{localStorage.setItem(K,JSON.stringify(S));}catch(e){}render();if(unsynced())setTimeout(flush,80);}
      else applyRemote(rd);
      if(window.confirmPendingUserAdd)window.confirmPendingUserAdd(rd);
    },function(e){cloud='err';cloudErr=(e&&e.message)||'تعذر الاتصال';if(e&&e.status===401){FBr=false;me=null;ses();render();}else render();});
  }
  window.fbInit=fbInit;window.addEventListener('fbready',fbInit);
  document.addEventListener('click',function(ev){var b=ev.target.closest('[data-a=out]');if(b&&window.FB)window.FB.logout();},true);
  doLogin=async function(){
    if(busy)return;
    var u=g('lu').trim(),p=g('lp').trim();lastU=u;err='';
    if(!u||!p){err='اكتب الاسم والكود';render();fill(u,p);return;}
    if(!window.FB||!window.FB.login){err='خدمة Supabase لم تجهز بعد، حدّث الصفحة';render();fill(u,p);return;}
    busy=true;err='⏳ جارٍ التحقق من الحساب...';render();fill(u,p);var localBefore=CL(S);
    try{
      var result=await window.FB.login(u,p),remote=fix(result.data||{});
      if(result.role==='admin'&&!hasData(remote)){
        if(hasData(localBefore))remote=fix(await window.FB.tx(function(current){return hasData(current)?current:localBefore;}));
        else if(window.FB.importLegacy){var legacy=await window.FB.importLegacy();if(hasData(legacy))remote=fix(await window.FB.tx(function(current){return hasData(current)?current:legacy;}));}
      }
      S=remote;base=CL(remote);saveBase();FBr=true;cloud='ok';cloudErr='';
      if(result.role==='admin')me={r:'a'};
      else{var person=byId(result.user_id);if(!person)throw new Error('لم يتم العثور على حساب المستفيد');me=mkReq(person);}
      ses();busy=false;err='';render();fbInit();
    }catch(e){busy=false;err=(e&&e.message==='invalid_credentials')?'الاسم أو الكود غير صحيح':(e&&e.status===401?'الاسم أو الكود غير صحيح':'تعذّر تسجيل الدخول إلى Supabase: '+((e&&e.message)||'تحقق من الإنترنت'));render();fill(u,p);}
  };
})();
</script>
